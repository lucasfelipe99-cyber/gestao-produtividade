services:
  - type: web
    name: gestao-produtividade
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gestao-produtividade-db
          property: connectionString

databases:
  - name: gestao-produtividade-db
    plan: free
    region: oregon
